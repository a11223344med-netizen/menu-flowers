<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خالة وديدة | المنيو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rakkas&family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F5EAD8;
  --cream-2:#EDE0CA;
  --cream-3:#E5D5B5;
  --terracotta:#D9692E;
  --terracotta-dark:#B4501E;
  --olive:#5C6B3E;
  --olive-dark:#414C2C;
  --brown:#3B2A1E;
  --gold:#D4A24C;
  --gold-light:#F0C870;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--cream);color:var(--brown);font-family:'Cairo',sans-serif;overflow-x:hidden;}
h1,h2,.brand{font-family:'Rakkas',serif;}

/* ── Zigzag border ── */
.zz{height:18px;width:100%;
  background:
    linear-gradient(135deg,var(--terracotta) 25%,transparent 25%) -0px 0/18px 18px,
    linear-gradient(-135deg,var(--terracotta) 25%,transparent 25%) -0px 0/18px 18px;
  background-color:var(--olive);}
.zz.flip{transform:scaleY(-1);}

/* ── Hero ── */
.hero{
  position:relative;text-align:center;
  padding:50px 20px 44px;
  background:linear-gradient(160deg,#fff8ee 0%,var(--cream) 70%);
  overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background-image:
    radial-gradient(circle, rgba(212,162,76,.15) 1px, transparent 1px);
  background-size:28px 28px;
  pointer-events:none;
}
.hero::after{
  content:"";position:absolute;bottom:-2px;left:0;right:0;height:40px;
  background:var(--cream);
  clip-path:ellipse(55% 100% at 50% 100%);
}

/* spinning crest */
.crest-wrap{position:relative;width:140px;height:140px;margin:0 auto 20px;}
.crest-ring{
  position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,var(--terracotta),var(--gold),var(--olive),var(--gold-light),var(--terracotta));
  animation:spinRing 20s linear infinite;
}
.crest-ring::before{
  content:"";position:absolute;inset:6px;border-radius:50%;
  background:var(--cream);
}
.crest-inner{
  position:absolute;inset:14px;border-radius:50%;
  background:linear-gradient(135deg,var(--cream-2),var(--cream-3));
  display:flex;align-items:center;justify-content:center;
  border:2px solid var(--gold);
}
.crest-inner .brand{font-size:32px;color:var(--terracotta-dark);line-height:1;}
@keyframes spinRing{to{transform:rotate(360deg);}}

.hero h1{
  font-size:clamp(44px,10vw,72px);
  color:var(--terracotta-dark);
  text-shadow:3px 3px 0 var(--gold),5px 5px 0 rgba(180,80,30,.15);
  line-height:1;
  opacity:0;animation:rise .8s .1s forwards ease-out;
}
.hero .slogan{
  font-size:clamp(15px,3.5vw,20px);font-weight:700;
  color:var(--olive-dark);letter-spacing:2px;
  margin-top:6px;
  opacity:0;animation:rise .8s .3s forwards ease-out;
}
.hero .location{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:16px;background:var(--olive);color:#fff;
  font-size:14px;font-weight:700;
  padding:7px 18px;border-radius:999px;
  box-shadow:0 4px 12px rgba(65,76,44,.35);
  opacity:0;animation:rise .8s .5s forwards ease-out;
}
@keyframes rise{to{opacity:1;transform:translateY(0);}from{opacity:0;transform:translateY(18px);}}

/* ── Nav ── */
.navwrap{
  position:sticky;top:0;z-index:100;
  background:rgba(245,234,216,.96);
  backdrop-filter:blur(8px);
  border-bottom:3px solid var(--terracotta);
  box-shadow:0 2px 16px rgba(60,40,20,.12);
}
.nav{
  display:flex;gap:8px;overflow-x:auto;
  padding:10px 14px;scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none;}
.nav button{
  flex:0 0 auto;
  border:2px solid var(--olive);
  background:transparent;color:var(--olive-dark);
  font-family:'Cairo',sans-serif;font-weight:800;font-size:13px;
  padding:7px 16px;border-radius:999px;cursor:pointer;
  white-space:nowrap;transition:all .22s ease;
}
.nav button:hover{background:var(--cream-2);}
.nav button.active{
  background:var(--olive);color:#fff;border-color:var(--olive);
  transform:scale(1.06);
  box-shadow:0 4px 12px rgba(65,76,44,.4);
}

/* ── Main content ── */
main{max-width:820px;margin:0 auto;padding:28px 16px 80px;}

/* ── Section ── */
section{margin-bottom:52px;scroll-margin-top:72px;}
.sec-head{
  display:flex;align-items:center;gap:0;
  margin-bottom:20px;position:relative;
}
.sec-head::after{
  content:"";flex:1;height:2px;
  background:linear-gradient(to left,transparent,var(--terracotta));
  margin-right:12px;
}
.sec-label{
  display:flex;align-items:center;gap:0;flex:0 0 auto;
}
.sec-label .diamond{
  width:16px;height:16px;
  background:var(--terracotta);
  transform:rotate(45deg);
  flex:0 0 auto;margin-left:-8px;z-index:1;
}
.sec-label h2{
  background:var(--terracotta);color:#fff;
  font-size:22px;padding:8px 24px 8px 18px;
  margin:0;
  box-shadow:4px 4px 0 var(--olive-dark);
  border-radius:0 12px 12px 0;
  position:relative;z-index:0;
}

/* ── Items ── */
.item{
  display:flex;align-items:center;gap:8px;
  padding:11px 12px;
  border-radius:10px;
  margin-bottom:5px;
  background:transparent;
  transition:background .2s;
  opacity:0;transform:translateX(12px);
}
.item.show{animation:slideIn .45s ease-out forwards;}
.item:hover{background:var(--cream-2);}
@keyframes slideIn{to{opacity:1;transform:translateX(0);}}
.item .name{font-weight:700;font-size:15.5px;flex:1 1 auto;line-height:1.3;}
.item .dots{
  flex:1 1 auto;max-width:80px;min-width:10px;
  border-bottom:2px dotted var(--cream-3);
}
.item .price{
  font-weight:900;color:var(--olive-dark);
  font-size:15px;flex:0 0 auto;
  background:var(--cream-2);
  border:1.5px solid var(--cream-3);
  padding:3px 11px;border-radius:8px;
  min-width:48px;text-align:center;
}
.item .price.tbc{color:var(--terracotta-dark);font-size:12px;background:transparent;border:none;}

/* dual size (boxes section) */
.price-pair{display:flex;gap:5px;flex:0 0 auto;}
.price-pair .price{font-size:13px;padding:3px 9px;min-width:54px;}
.price-pair .price small{display:block;font-size:9px;font-weight:700;opacity:.7;margin-top:1px;}
.price-pair .price.sm{background:#e7d9c0;color:var(--brown);}
.price-pair .price.lg{background:var(--olive);color:#fff;border-color:var(--olive-dark);}

/* featured badge */
.badge{
  font-size:10px;font-weight:900;
  background:linear-gradient(135deg,var(--gold),var(--gold-light));
  color:var(--brown);
  padding:3px 9px;border-radius:6px;
  flex:0 0 auto;white-space:nowrap;
  box-shadow:0 2px 6px rgba(212,162,76,.4);
  animation:glimmer 2.5s infinite;
}
@keyframes glimmer{
  0%,100%{box-shadow:0 2px 6px rgba(212,162,76,.4);}
  50%{box-shadow:0 2px 14px rgba(212,162,76,.75);}
}

/* row separator */
.item:not(:last-child){border-bottom:1px dashed rgba(185,155,100,.3);}

/* size legend */
.size-legend{
  display:flex;gap:12px;margin-bottom:14px;
  font-size:13px;font-weight:700;
}
.size-legend span{
  display:flex;align-items:center;gap:6px;padding:4px 12px;border-radius:8px;
}
.size-legend .leg-sm{background:#e7d9c0;color:var(--brown);}
.size-legend .leg-lg{background:var(--olive);color:#fff;}

/* ── FAB back to top ── */
#fab{
  position:fixed;bottom:24px;left:20px;
  width:46px;height:46px;border-radius:50%;
  background:var(--terracotta);color:#fff;
  border:none;cursor:pointer;font-size:20px;
  box-shadow:0 4px 16px rgba(180,80,30,.45);
  display:flex;align-items:center;justify-content:center;
  opacity:0;transform:scale(.7);pointer-events:none;
  transition:all .3s ease;z-index:200;
}
#fab.show{opacity:1;transform:scale(1);pointer-events:all;}

/* ── Footer ── */
footer{
  background:var(--olive-dark);color:#f2e8d8;
  text-align:center;padding:40px 20px 30px;
}
footer .brand{font-size:32px;color:var(--gold-light);display:block;margin-bottom:4px;}
footer .slogan-f{font-size:15px;opacity:.8;margin-bottom:20px;}
.contacts{display:flex;flex-direction:column;gap:10px;}
.contact-row{
  display:flex;align-items:center;justify-content:center;gap:10px;
  font-size:15px;font-weight:700;
}
.contact-row a{color:#f2e8d8;text-decoration:none;transition:color .2s;}
.contact-row a:hover{color:var(--gold-light);}
.contact-icon{
  width:32px;height:32px;border-radius:50%;
  background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;flex:0 0 auto;
}
footer .copy{margin-top:24px;font-size:11px;opacity:.45;}
</style>
</head>
<body>

      ["فلافل محشيه رول","30"],["فلافل كيري بسطرمه رول","55"],

      ["رومي لانشون","25"],["توستر تشيز","30"],["جبنه ساده","13"]
    ]

const nav = document.getElementById('navBar');
const mainEl = document.getElementById('main');

DATA.forEach(sec=>{
  // nav btn
  const btn = document.createElement('button');
  btn.textContent = sec.title;
  btn.onclick = ()=>{
    const target = document.getElementById(sec.id);
    const navH = document.querySelector('.navwrap').offsetHeight;
    const top = target.getBoundingClientRect().top + window.pageYOffset - navH - 8;
    window.scrollTo({top, behavior:'smooth'});
  };
  nav.appendChild(btn);

  // section
  const s = document.createElement('section');
  s.id = sec.id;

  // header
  const head = document.createElement('div');
  head.className = 'sec-head';
  head.innerHTML = `<div class="sec-label"><div class="diamond"></div><h2>${sec.title}</h2></div>`;
  s.appendChild(head);

  // size legend for dual sections
  if(sec.dualSize){
    const leg = document.createElement('div');
    leg.className = 'size-legend';
    leg.innerHTML = `<span class="leg-sm">🔸 صغيرة</span><span class="leg-lg">🔶 كبيرة</span>`;
    s.appendChild(leg);
  }

  sec.items.forEach((entry)=>{
    const row = document.createElement('div');
    row.className = 'item';
    let priceHtml, name, featured;
    if(sec.dualSize){
      const [n, small, large, feat] = entry;
      name = n; featured = feat;
      priceHtml = large
        ? `<span class="price-pair">
            <span class="price sm">${small}<br><small>صغيرة</small></span>
            <span class="price lg">${large}<br><small>كبيرة</small></span>
           </span>`
        : `<span class="price">${small} ج</span>`;
    } else {
      const [n, price, feat] = entry;
      name = n; featured = feat;
      priceHtml = price
        ? `<span class="price">${price} ج</span>`
        : `<span class="price tbc">—</span>`;
    }
    row.innerHTML = `
      <span class="name">${name}</span>
      <span class="dots"></span>
      ${featured ? '<span class="badge">⭐ اختراع خالة</span>' : ''}
      ${priceHtml}`;
    s.appendChild(row);
  });

  mainEl.appendChild(s);
});

// scroll-spy
const sections = [...document.querySelectorAll('main section')];
const buttons  = [...nav.children];
new IntersectionObserver(entries=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const i = sections.indexOf(e.target);
      buttons.forEach(b=>b.classList.remove('active'));
      if(buttons[i]) buttons[i].classList.add('active');
    }
  });
},{rootMargin:'-25% 0px -60% 0px'}).observe;
// manual spy to avoid issues
const sectionEls = [...document.querySelectorAll('section')];
window.addEventListener('scroll',()=>{
  const mid = window.scrollY + window.innerHeight * 0.35;
  let active = 0;
  sectionEls.forEach((s,i)=>{
    if(s.offsetTop <= mid) active = i;
  });
  buttons.forEach(b=>b.classList.remove('active'));
  if(buttons[active]) buttons[active].classList.add('active');
},{passive:true});

// stagger reveal
const io = new IntersectionObserver(entries=>{
  entries.forEach((e,idx)=>{
    if(e.isIntersecting){
      const items = [...e.target.querySelectorAll('.item:not(.show)')];
      items.forEach((it,i)=>{
        it.style.animationDelay = (i*0.045)+'s';
        it.classList.add('show');
      });
      io.unobserve(e.target);
    }
  });
},{threshold:0.05});
sectionEls.forEach(s=>io.observe(s));
</script>
